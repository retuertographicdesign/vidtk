<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía Toke Tuk Canarias</title>
<style>
  :root{
    --bg: #F1E8D9;
    --card: #FFFFFF;
    --line: #E4D6BE;
    --ink: #22261E;
    --ink-dim: #6B6255;
    --green: #1F5C34;
    --green-dark: #17472A;
    --green-tint: #E7F0E5;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; min-height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  .wrap{ width:100%; max-width:460px; text-align:center; }
  .brand{ display:flex; flex-direction:column; align-items:center; margin-bottom:26px; }
  .brand-logo{ width:200px; max-width:72vw; height:auto; margin-bottom:12px; }
  .brand-tagline{ font-size:13px; color:var(--ink-dim); font-weight:600; line-height:1.4; }
  .brand-tagline strong{ display:block; color:var(--ink); font-weight:800; font-size:15px; letter-spacing:.01em; }

  h1{ font-size:22px; font-weight:800; letter-spacing:-0.01em; margin:0 0 6px; }
  p.sub{ margin:0 0 26px; color:var(--ink-dim); font-size:14px; line-height:1.5; }

  .routes{ display:flex; flex-direction:column; gap:12px; }
  .route-card{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    text-decoration:none; color:var(--ink);
    box-shadow:0 1px 2px rgba(34,38,30,0.05);
    text-align:left;
  }
  .route-card:active{ background:var(--green-tint); border-color:var(--green); }
  .route-icon{
    flex-shrink:0; width:44px; height:44px; border-radius:12px;
    background:var(--green-tint); color:var(--green);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .route-text{ flex:1; }
  .route-name{ font-weight:750; font-size:15.5px; letter-spacing:-0.005em; }
  .route-sub{ font-size:12.5px; color:var(--ink-dim); margin-top:2px; }
  .route-arrow{ color:var(--green); font-size:18px; flex-shrink:0; }

  footer{ margin-top:28px; font-size:12px; color:var(--ink-dim); }
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand">
      <img src="logo.png" alt="Toke Tuk Canarias" class="brand-logo">
      <div class="brand-tagline">
        <strong>Guía Toke Tuk</strong>
        <span>Descubre Canarias 🌴</span>
      </div>
    </div>

    <h1>Elige tu recorrido</h1>
    <p class="sub">Selecciona la zona para ver su guía en vídeo.</p>

    <div class="routes">
      <a class="route-card" href="https://tokenix.retuerto.es/puertodelacruz">
        <div class="route-icon">🌺</div>
        <div class="route-text">
          <div class="route-name">Puerto de la Cruz</div>
          <div class="route-sub">Norte de Tenerife</div>
        </div>
        <div class="route-arrow">→</div>
      </a>

      <a class="route-card" href="https://tokenix.retuerto.es/santacruz/">
        <div class="route-icon">🏙️</div>
        <div class="route-text">
          <div class="route-name">Santa Cruz de Tenerife</div>
          <div class="route-sub">Capital</div>
        </div>
        <div class="route-arrow">→</div>
      </a>

      <a class="route-card" href="https://tokenix.retuerto.es/surdetenerife/">
        <div class="route-icon">🏖️</div>
        <div class="route-text">
          <div class="route-name">Costa Adeje · Los Cristianos</div>
          <div class="route-sub">Sur de Tenerife</div>
        </div>
        <div class="route-arrow">→</div>
      </a>

      <a class="route-card" href="https://tokenix.retuerto.es/laspalmas/">
        <div class="route-icon">🏛️</div>
        <div class="route-text">
          <div class="route-name">Las Palmas de Gran Canaria</div>
          <div class="route-sub">Gran Canaria</div>
        </div>
        <div class="route-arrow">→</div>
      </a>
    </div>

    <footer>Toke Tuk Canarias</footer>
  </div>


<script>(function(d, s, id){
  var js, fjs = d.getElementsByTagName(s)[0];
  if (d.getElementById(id)) return;
  js = d.createElement(s); js.id = id;
  js.src = 'https://api.anychat.one/widget/a193a296-0efd-3881-8edb-3112686db56b/livechat-js?r=' + encodeURIComponent(window.location);
  fjs.parentNode.insertBefore(js, fjs);
}(document, 'script', 'contactus-jssdk'));</script>
</body>
</html>
